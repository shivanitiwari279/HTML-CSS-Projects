<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to the page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">

        <main>
            <div class="two-column-style">

                <div class="bg-text">
                    <h2>WELCOME BACK </h2><br><span>Good to see you again!</span><br><h2>Log in to continue your journey <br>and reach to your goals.</h2>
                </div>

                <div class="wrapper">
                    <section>
                        <div class="upper-part">
                            <img src="image/login logo.jpeg" alt="">
                            <h1>Login</h1>
                            <p>Enter your details to get started</p>
                        </div>
                    </section>
                    <section>
                        <form>
                            <label>
                                <input type="email or username" id="email or username" name="Email or Ussername" placeholder="Email or Ussername">
                                <br><br>
                                <input type="password" id="password" name="password" placeholder="Password">
                            </label>
                    </section>
                    <section>
                        <div class="forget-pass">
                            <label>
                                <input type="checkbox" value="remember_me" name="remember" id="remember-checkbox">Remember me
                            </label>
                            <a href="#">Forget Password?</a>
                        </div>
                       
                    </section>
                    <button type="submit" class="login-button">Login ➡️</button>

                     </form>
                    <section>
                        <p>Don't have an account? <a href="">Create Account</a></p>
                    </section>
                </div>

        </div>
        </main>

    </div>
</body>
</html>
